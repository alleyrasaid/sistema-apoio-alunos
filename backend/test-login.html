<!DOCTYPE html>
<html>
<head>
    <title>Teste de Login Firebase</title>
</head>
<body>
    <h1>Obter Token de Teste</h1>
    <script type="module">

        const firebaseConfig = {
        apiKey: "AIzaSyAyN-BwYsEV6ItieMg8b_CLrcSPgDhfW9I",
        authDomain: "sistema-de-apoio-a-alunos.firebaseapp.com",
        projectId: "sistema-de-apoio-a-alunos",
        storageBucket: "sistema-de-apoio-a-alunos.firebasestorage.app",
        messagingSenderId: "87957535973",
        appId: "1:87957535973:web:bcbb210d2f41c68234e80c",
        measurementId: "G-8FEZGLTDVS"
        };
        
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = async function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const idToken = await userCredential.user.getIdToken();
                console.log("SEU TOKEN DE TESTE (copie tudo abaixo):");
                console.log(idToken);
                alert("Token gerado! Verifique o console do navegador (F12).");
            } catch (error) {
                console.error("Erro no login:", error);
                alert("Erro no login: " + error.message);
            }
        }
    </script>
    <input type="email" id="email" placeholder="Email do usuário de teste"><br>
    <input type="password" id="pass" placeholder="Senha"><br>
    <button onclick="login()">Logar e Gerar Token</button>
</body>
</html>

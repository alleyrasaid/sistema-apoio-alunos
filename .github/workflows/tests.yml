name: 🧪 Testes Automatizados

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    name: ✅ Rodar Testes
    
    steps:
    - name: 📥 Baixar código
      uses: actions/checkout@v4
    
    - name: 📦 Instalar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
    
    - name: 🧩 Instalar dependências
      run: npm ci
    
    - name: 🧪 Rodar testes
      run: npm run test:run
    
   # - name: 🏗️ Testar build
   #   run: npm run build
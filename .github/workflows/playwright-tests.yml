name: Playwright Tests CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  playwright-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Instalar Playwright browsers
      run: npx playwright install --with-deps

    - name: Executar testes Playwright
      run: npx playwright test
      env:
        TEST_URL: https://sistema-de-apoio-a-alunos.web.app

    - name: Upload relatório de testes
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Upload traces de falhas
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/
        retention-days: 7

  # Job opcional para testes de compatibilidade - REMOVIDO A DEPENDÊNCIA
  matrix-tests:
    # REMOVED: needs: playwright-tests  # Isso causa falha em cascata
    if: success()  # Só executa se o workflow principal passar
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]  # Removido 16.x que pode estar causando problemas
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Executar testes de compatibilidade
      run: npx playwright test --project=chromium
      env:
        TEST_URL: https://sistema-de-apoio-a-alunos.web.app
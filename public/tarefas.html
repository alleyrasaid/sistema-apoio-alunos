<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="home-body">
    <header class="main-header">
        <div class="logo">
            <img src="assets/imagelogo.png" alt="Logotipo">
        </div>
        <nav class="button-group">
            <a href="home.html" class="nav-btn active">Minhas Tarefas</a>
            <a href="disciplinas.html" class="nav-btn">Minhas Disciplinas</a>
            <a href="#" id="logout-btn" class="nav-btn">Sair</a>
        </nav>
    </header>

    <main class="home-main">
        <h1 id="disciplina-titulo">Carregando tarefas...</h1>

        <div class="table-container">
            <div class="table-title">Tarefas</div>
            <table class="tarefas-table">
                <thead>
                    <tr>
                        <th>Descrição</th>
                        <th>Status</th>
                        <th>Data de Entrega</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tarefas-tbody">
                    </tbody>
            </table>
        </div>
        
        <a href="#" id="add-tarefa-btn" class="btn-action">+ Adicionar Nova Tarefa</a>
    </main>
    <img src="assets/image11.png" alt="Ilustração" class="home-illustration-left">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/tarefas.js"></script>
</body>
</html>

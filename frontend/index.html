<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/transitions.css">
</head>
<body>
    <div class="container">
        <!-- Coluna Esquerda: Conteúdo do Login -->
        <div class="login-section">
            <header class="login-header">
                <div class="logo">
                    <img src="assets/imagelogo.png" alt="Logotipo do Sistema de Apoio a Alunos">
                </div>
                <p class="signup-link">
                    Não tem conta ainda? <a href="signup.html">Clique aqui</a>
                </p>
            </header>

            <main class="login-main">
                <h1>Login</h1>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Usuário ou email</label>
                        <input type="email" id="email" placeholder="exemplo.email@gmail.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="digite 8 ou mais caracteres">
                    </div>
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <a href="#" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    <button type="submit" class="btn-login">Entrar</button>
                </form>

                <div class="social-login">
                    <p>Ou logue por estas opções:</p>
                    <div class="social-buttons">
                        <button id="google-login-btn" class="social-btn google">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15.999 8.18182C15.999 7.63636 15.9536 7.09091 15.8627 6.54545H8.18091V9.45455H12.6236C12.4427 10.3636 11.8855 11.2727 11.0173 11.8182V13.7273H13.4355C14.9809 12.3636 15.999 10.4545 15.999 8.18182Z" fill="#C71610"/>
                                <path d="M8.18182 16C10.6 16 12.6273 15.1818 13.4364 13.7273L11.0182 11.8182C10.2091 12.3636 9.2 12.7273 8.18182 12.7273C6.22727 12.7273 4.59091 11.4545 3.99091 9.72727H1.48182V11.6364C2.38182 14.0909 5.04545 16 8.18182 16Z" fill="#C71610"/>
                                <path d="M3.99091 9.72727C3.80909 9.18182 3.71818 8.63636 3.71818 8C3.71818 7.36364 3.80909 6.81818 3.99091 6.27273V4.36364H1.48182C0.536364 6.09091 0 8 0 8C0 8 0.536364 9.90909 1.48182 11.6364L3.99091 9.72727Z" fill="#C71610"/>
                                <path d="M8.18182 3.27273C9.44545 3.27273 10.4545 3.72727 11.0182 4.27273L13.4818 1.81818C12.6273 0.909091 10.6 0 8.18182 0C5.04545 0 2.38182 1.90909 1.48182 4.36364L3.99091 6.27273C4.59091 4.54545 6.22727 3.27273 8.18182 3.27273Z" fill="#C71610"/>
                                </svg>
                        </button>
                        <!-- Botão Facebook com SVG -->
                    </div>
                </div>
            </main>
        </div>

        <!-- Coluna Direita: Ilustração e Citação -->
        <div class="illustration-section">
            <div class="illustration-content">
                <img src="assets/image2.png" alt="Ilustração de estudantes e material escolar">
                <blockquote>
                    <p>"A mente que se abre a uma nova ideia, jamais voltará ao seu tamanho original."</p>
                    <footer>Albert Einstein</footer>
                </blockquote>
            </div>
        </div>
    </div>

</body>
</html>

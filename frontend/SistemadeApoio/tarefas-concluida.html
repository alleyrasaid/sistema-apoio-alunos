<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="home-body">
    <header class="main-header">
        <div class="logo"><img src="assets/imagelogo.png" alt="Logotipo do Sistema de Apoio a Alunos"></div>
        <nav class="button-group">
            <a href="#" class="nav-btn active">Minhas Tarefas</a>
            <a href="disciplinas-lista.html" class="nav-btn">Minhas Disciplinas</a>
            <a href="index.html" class="nav-btn">Sair</a>
        </nav>
    </header>
    <main class="home-main">
        <h1>Olá, usuário!</h1>
        <div class="table-container">
            <div class="table-title">Tarefas</div>
            <table class="tarefas-table">
                <thead>
                    <tr>
                        <th>Concluídas <i class="fa-solid fa-square-check"></i></th>
                        <th>Pendentes <i class="fa-solid fa-square-xmark"></i></th>
                        <th>Data</th>
                        <th>Check</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="task-cell">
                            <span>Entregar documentação de Escopo</span>
                        </td>
                        <td></td>
                        <td>20/09/2025</td>
                        <td><input type="checkbox" class="task-checkbox" checked></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a href="add-tarefa.html" class="btn-action">+ Adicionar Nova Tarefa</a>
    </main>
    <img src="assets/image8.png" alt="Ilustração de uma estudante" class="home-illustration-left">
</body>
</html>

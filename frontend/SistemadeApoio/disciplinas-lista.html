<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Disciplinas - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/transitions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/transitions.js" defer></script>
</head>
<body class="home-body">
    <!-- Cabeçalho Principal com Navegação -->
    <header class="main-header">
        <div class="logo">
            <img src="assets/imagelogo.png" alt="Logotipo do Sistema de Apoio a Alunos">
        </div>
        <nav class="button-group">
            <a href="tarefas.html" class="nav-btn">Minhas Tarefas</a>
            <a href="#" class="nav-btn active">Minhas Disciplinas</a>
            <a href="index.html" class="nav-btn">Sair</a>
        </nav>
    </header>

    <!-- Conteúdo Principal da Página -->
    <main class="home-main">
        <h1>Olá, usuário!</h1>

        <div class="table-container">
            <div class="table-title">Disciplinas Cadastradas</div>
            <table class="disciplinas-table">
                <thead>
                    <tr>
                        <th>Disciplina</th>
                        <th>Professor</th>
                        <th>Editar</th>
                        <th>Excluir</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Engenharia de Software II</td>
                        <td class="professor-cell">
                            <i class="fa-solid fa-book subject-icon"></i>
                            <span>Kissiomara</span>
                        </td>
                        <td>
                            <a href="#" class="icon-btn edit-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                            </a>
                        </td>
                        <td>
                            <a href="disciplinas-lista-deleted.html" class="icon-btn delete-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>Banco de Dados</td>
                        <td class="professor-cell">
                            <i class="fa-solid fa-scroll subject-icon"></i>
                            <span>Prof. Anônimo</span>
                        </td>
                        <td>
                            <a href="#" class="icon-btn edit-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                            </a>
                        </td>
                        <td>
                            <a href="#" class="icon-btn delete-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </a>
                        </td>
                    </tr>
                    <tr>
                        <td>Redes de Computadores</td>
                        <td class="professor-cell">
                            <i class="fa-solid fa-chalkboard-user subject-icon"></i>
                            <span>Prof. Convidado</span>
                        </td>
                        <td>
                            <a href="#" class="icon-btn edit-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
                            </a>
                        </td>
                        <td>
                            <a href="#" class="icon-btn delete-btn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </a>
                        </td>
                    </tr>
                    <!-- Adicione mais linhas aqui -->
                </tbody>
            </table>
        </div>

        <a href="add-disciplina.html" class="btn-action btn-add-discipline">+ Adicionar Nova Disciplina</a>
    </main>

    <!-- Ilustração Decorativa -->
    <img src="assets/image7.png" alt="Ilustração de estudantes com material escolar" class="home-illustration">

    <!-- Modal de Edição -->
    <div id="edit-subject-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Editar Disciplina</h2>
            <form id="edit-subject-form">
                <div class="form-field">
                    <label for="edit-subject-name">Nome da Disciplina</label>
                    <input type="text" id="edit-subject-name" required>
                </div>
                <div class="form-field">
                    <label for="edit-professor-name">Nome do Professor</label>
                    <input type="text" id="edit-professor-name" required>
                </div>
                <button type="submit" class="btn-login">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const table = document.querySelector('.disciplinas-table');
            const modal = document.getElementById('edit-subject-modal');
            const closeModalBtn = modal.querySelector('.close-btn');
            const editForm = document.getElementById('edit-subject-form');
            const subjectNameInput = document.getElementById('edit-subject-name');
            const professorNameInput = document.getElementById('edit-professor-name');
            let currentRow = null;

            function openModal(row) {
                currentRow = row;
                const subjectName = row.cells[0].textContent;
                const professorName = row.querySelector('.professor-cell span').textContent;
                
                subjectNameInput.value = subjectName;
                professorNameInput.value = professorName;
                modal.classList.add('modal-visible');
            }

            function closeModal() {
                modal.classList.remove('modal-visible');
                currentRow = null;
            }

            editForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (currentRow) {
                    currentRow.cells[0].textContent = subjectNameInput.value;
                    currentRow.querySelector('.professor-cell span').textContent = professorNameInput.value;
                    closeModal();
                }
            });

            closeModalBtn.addEventListener('click', closeModal);
            window.addEventListener('click', function(e) {
                if (e.target == modal) {
                    closeModal();
                }
            });

            table.addEventListener('click', function (e) {
                const editButton = e.target.closest('.edit-btn');
                if (editButton) {
                    e.preventDefault();
                    openModal(editButton.closest('tr'));
                    return;
                }

                const deleteButton = e.target.closest('.delete-btn');
                if (deleteButton) {
                    e.preventDefault();
                    if (confirm('Tem certeza que deseja excluir esta disciplina?')) {
                        const row = deleteButton.closest('tr');
                        row.classList.add('fade-out');
                        setTimeout(() => row.remove(), 300); // Espera a animação terminar
                    }
                }
            });
        });
    </script>

</body>
</html>

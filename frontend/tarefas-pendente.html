<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/transitions.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="js/transitions.js" defer></script>
</head>
<body class="home-body">
    <header class="main-header">
        <div class="logo"><img src="assets/imagelogo.png" alt="Logotipo do Sistema de Apoio a Alunos"></div>
        <nav class="button-group">
            <a href="#" class="nav-btn active">Minhas Tarefas</a>
            <a href="disciplinas-lista.html" class="nav-btn">Minhas Disciplinas</a>
            <a href="index.html" class="nav-btn">Sair</a>
        </nav>
    </header>
    <main class="home-main">
        <h1>Olá, usuário!</h1>
        <div class="table-container">
            <div class="table-title">Tarefas Pendentes</div>
            <table class="tarefas-table" id="tarefas-pendentes">
                <thead>
                    <tr>
                        <th>Concluídas <i class="fa-solid fa-square-check"></i></th>
                        <th>Pendentes <i class="fa-solid fa-square-xmark"></i></th>
                        <th>Data</th>
                        <th>Check</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td></td>
                        <td class="task-cell">
                            <span>Entregar documentação de Escopo</span>
                            <div class="task-actions">
                                <a href="#" class="icon-btn edit-btn"><i class="fa-solid fa-pencil"></i></a>
                                <a href="#" class="icon-btn delete-btn"><i class="fa-solid fa-trash"></i></a>
                            </div>
                        </td>
                        <td>20/09/2025</td>
                        <td><input type="checkbox" class="task-checkbox"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="table-container">
            <div class="table-title">Tarefas Concluídas</div>
            <table class="tarefas-table" id="tarefas-concluidas">
                <thead>
                    <tr>
                        <th>Concluídas <i class="fa-solid fa-square-check"></i></th>
                        <th>Pendentes <i class="fa-solid fa-square-xmark"></i></th>
                        <th>Data</th>
                        <th>Check</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Tarefas concluídas aparecerão aqui -->
                </tbody>
            </table>
        </div>

        <a href="add-tarefa.html" class="btn-action btn-add-task">+ Adicionar Nova Tarefa</a>
    </main>
    <img src="assets/image10.png" alt="Ilustração de uma estudante" class="home-illustration-left">

    <!-- Modal de Edição -->
    <div id="edit-task-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Editar Tarefa</h2>
            <form id="edit-task-form">
                <div class="form-field">
                    <label for="edit-task-name">Nome da Tarefa</label>
                    <input type="text" id="edit-task-name" required>
                </div>
                <div class="form-field">
                    <label for="edit-task-date">Data</label>
                    <input type="text" id="edit-task-date" required>
                </div>
                <button type="submit" class="btn-login">Salvar</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const tarefasPendentesBody = document.querySelector('#tarefas-pendentes tbody');
            const tarefasConcluidasBody = document.querySelector('#tarefas-concluidas tbody');
            const modal = document.getElementById('edit-task-modal');
            const closeModalBtn = modal.querySelector('.close-btn');
            const editForm = document.getElementById('edit-task-form');
            const taskNameInput = document.getElementById('edit-task-name');
            const taskDateInput = document.getElementById('edit-task-date');
            let currentRow = null;

            function openModal(row) {
                currentRow = row;
                const taskName = row.querySelector('.task-cell span').textContent;
                const taskDate = row.cells[2].textContent;
                
                taskNameInput.value = taskName;
                taskDateInput.value = taskDate;
                modal.classList.add('modal-visible');
            }

            function closeModal() {
                modal.classList.remove('modal-visible');
                currentRow = null;
            }

            editForm.addEventListener('submit', function(e) {
                e.preventDefault();
                if (currentRow) {
                    currentRow.querySelector('.task-cell span').textContent = taskNameInput.value;
                    currentRow.cells[2].textContent = taskDateInput.value;
                    closeModal();
                }
            });

            closeModalBtn.addEventListener('click', closeModal);
            window.addEventListener('click', function(e) {
                if (e.target == modal) {
                    closeModal();
                }
            });

            function handleTableClick(e) {
                // Botão de editar
                const editBtn = e.target.closest('.edit-btn');
                if (editBtn) {
                    e.preventDefault();
                    openModal(editBtn.closest('tr'));
                    return;
                }

                // Excluir tarefa
                const deleteBtn = e.target.closest('.delete-btn');
                if (deleteBtn) {
                    e.preventDefault();
                    if (confirm('Tem certeza que deseja excluir esta tarefa?')) {
                        const row = deleteBtn.closest('tr');
                        row.classList.add('fade-out');
                        setTimeout(() => row.remove(), 300);
                    }
                    return; // Para a execução para não interferir com o checkbox
                }

                // Mover tarefa
                if (e.target.classList.contains('task-checkbox')) {
                    const row = e.target.closest('tr');
                    if (e.target.checked) {
                        // Move para concluídas
                        tarefasConcluidasBody.appendChild(row);
                    } else {
                        // Move de volta para pendentes
                        tarefasPendentesBody.appendChild(row);
                    }
                }
            }

            tarefasPendentesBody.addEventListener('click', handleTableClick);
            tarefasConcluidasBody.addEventListener('click', handleTableClick);
        });
    </script>
</body>
</html>
    </script>
</body>
</html>

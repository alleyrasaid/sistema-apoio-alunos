<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Disciplina - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/transitions.css">
</head>
<body class="home-body">
    <header class="main-header">
        <nav class="button-group">
            <a href="home.html" class="nav-btn">Minhas Tarefas</a>
            <a href="disciplinas.html" class="nav-btn active">Minhas Disciplinas</a>
            <a href="#" id="logout-btn" class="nav-btn">Sair</a> </nav>
    </header>

    <main class="home-main">
        <h1>Adicionar Nova Disciplina</h1>

        <form class="disciplina-form" id="add-disciplina-form">
            <div class="form-group">
                <label for="disciplina-nome">Nome da Disciplina</label>
                <input type="text" id="disciplina-nome" placeholder="Ex: Cálculo I" required>
            </div>
            <div class="form-group">
                <label for="professor-nome">Nome do Professor (opcional)</label>
                <input type="text" id="professor-nome" placeholder="Ex: Isaac Newton">
            </div>
            <button type="submit" class="btn-login">Adicionar Disciplina</button>
        </form>
    </main>
    <img src="assets/image7.png" alt="Ilustração" class="home-illustration">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/add-disciplina.js"></script>
</body>
</html>

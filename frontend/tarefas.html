<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas - Sistema de Apoio a Alunos</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="home-body">
    <!-- Cabeçalho Principal com Navegação -->
    <header class="main-header">
        <div class="logo">
            <img src="assets/imagelogo.png" alt="Logotipo do Sistema de Apoio a Alunos">
        </div>
        <nav class="button-group">
            <a href="#" class="nav-btn active">Minhas Tarefas</a>
            <a href="disciplinas-lista.html" class="nav-btn">Minhas Disciplinas</a>
            <a href="index.html" class="nav-btn">Sair</a>
        </nav>
    </header>

    <!-- Conteúdo Principal da Página -->
    <main class="home-main">
        <h1>Olá, usuário!</h1>

        <div class="table-container">
            <div class="table-title">Tarefas</div>
            <table class="tarefas-table">
                <thead>
                    <tr>
                        <th>Concluídas <i class="fa-solid fa-square-check"></i></th>
                        <th>Pendentes <i class="fa-solid fa-square-xmark"></i></th>
                        <th>Data</th>
                        <th>Check</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas de tarefas serão inseridas aqui -->
                </tbody>
            </table>
        </div>

        <a href="add-tarefa.html" class="btn-action">+ Adicionar Nova Tarefa</a>
    </main>

    <!-- Ilustração Decorativa -->
    <img src="assets/image11.png" alt="Ilustração de uma estudante" class="home-illustration-left">

</body>
</html>
